# JARVIS settings. Restart JARVIS to apply changes.
#
# To keep your own changes separate (recommended), create a file called
# settings.local.toml beside this one and put only the settings you want to
# change in it, under the same [section] names. It takes priority over this
# file, and updates never touch it. Example settings.local.toml:
#
#   [assistant]
#   location = "Dubai"
#
#   [voice]
#   wake_threshold = 0.6
# The API key is NOT stored here. It is read from the ANTHROPIC_API_KEY
# environment variable only.

[assistant]
address_as = "Sir"
# Which brain to use:
#   "ollama"     a free model running on this computer (see [ollama] below)
#   "openai_compatible"  a hosted service that uses the OpenAI chat format
#                (see [openai_compatible] below)
#   "anthropic"  Claude through the Anthropic API: far more capable, paid,
#                needs the ANTHROPIC_API_KEY environment variable
provider = "openai_compatible"
# The settings from here to max_steps apply to "anthropic" only.
model = "claude-fable-5-2"
# How hard the model thinks: low | medium | high | xhigh | max.
# Higher is slower and costs more. "medium" suits everyday requests.
effort = "medium"
# If the model's safety filters decline a request, let Anthropic retry it on
# another model automatically. Set to false to simply report the refusal.
refusal_fallback = true
# Safety cap on tool calls per request, so a confused loop cannot run forever.
max_steps = 40
# Every request resends the whole conversation, so a long one gets slow and
# uses many tokens. When the conversation passes this size (in tokens,
# roughly 3/4 of a word each), JARVIS condenses it: the model continues from
# a written recap instead of the full history. Lower = cheaper, but it
# forgets detail sooner. The instructions and tool list alone are about
# 10,000.
context_budget = 40000
# Your model service's daily token allowance, for the usage gauge. Used only
# if the service does not report it itself. 0 = unknown.
daily_token_limit = 10000000
location = "Sharjah"

[ollama]
# Any Ollama model that supports tool calling: https://ollama.com/search?c=tool
# Download it first with:  ollama pull qwen3:8b
# Bigger models are more reliable but need more graphics memory (VRAM):
# roughly 6 GB for an 8b model, 10 GB for 14b, 20 GB for 30b+.
model = "qwen3:8b"
host = "http://127.0.0.1:11434"
# How much conversation the model can hold, in tokens. Larger holds longer
# conversations but uses more graphics memory; if the model no longer fits
# on the graphics card it spills onto the processor and becomes very slow.
context_window = 8192
# Let the model reason silently before answering. Better on hard tasks, but
# can add tens of seconds to every reply.
think = false
# How long the model stays loaded after the last message.
keep_alive = "30m"

[openai_compatible]
# For hosted model services that speak the OpenAI "chat completions" format.
# base_url is the address from the service's API documentation, ending in /v1
# (JARVIS adds /chat/completions). model is the model's name on that service.
# The model must support tool (function) calling.
base_url = "https://api.ifm.ai/v1"
model = "IFM/K2-Horizon-375B-A23B"
# The NAME of the environment variable holding your key, never the key
# itself. Store the key with:  setx JARVIS_API_KEY "your-key-here"
api_key_env = "JARVIS_API_KEY"

[sight]
# Let JARVIS look at your screen when you ask it to. Each look sends one
# picture to Google Gemini (connect with: python -m jarvis connect gemini).
# The eye button in the window switches this on and off.
enabled = true
# The Gemini model used as JARVIS's eyes. If this key cannot use it, a few
# others are tried automatically.
model = "gemini-3.5-flash-lite"

[launcher]
# The quick-launch buttons at the right of the window. "open" is a folder or
# file path, a web address, or an app's name as it appears in the Start menu.
# Up to 16.
items = [
    { label = "Documents", open = "~/Documents" },
    { label = "Downloads", open = "~/Downloads" },
    { label = "Pictures", open = "~/Pictures" },
    { label = "Music", open = "~/Music" },
    { label = "Gmail", open = "https://mail.google.com" },
    { label = "Calendar", open = "https://calendar.google.com" },
    { label = "YouTube", open = "https://www.youtube.com" },
    { label = "GitHub", open = "https://github.com" },
    { label = "Notion", open = "https://www.notion.so" },
    { label = "Spotify", open = "Spotify" },
    { label = "Notepad", open = "Notepad" },
    { label = "Explorer", open = "File Explorer" },
]

[memory]
# Remember your preferences, people and projects between conversations, and
# keep a searchable record of past requests. Stored on this computer in
# ~/.jarvis/memory.db. View with /memories, delete with /forget.
enabled = true

[voice]
# Speech runs entirely on this computer. Set up once with:
#   python -m jarvis voice-setup
enabled = true
# Speech recognition model. "base.en" is quick; "small.en" is more accurate
# but slower. Runs on the processor, not the graphics card.
whisper_model = "base.en"
# The speaking voice. Others are listed at https://rhasspy.github.io/piper-samples/
piper_voice = "en_GB-alan-medium"
# When JARVIS answers aloud: "when_spoken" (only if you spoke),
# "always", or "never".
speak_replies = "when_spoken"
# After JARVIS answers a spoken request, keep listening for a few seconds so
# you can reply without saying "Hey Jarvis" again.
follow_up = true
# Listen for "Hey Jarvis" while the window is open. The microphone stays on,
# but audio is checked on this computer and discarded; nothing is recorded
# until the phrase is heard. The ear button in the window turns it off.
wake_word = true
# How sure the detector must be, 0 to 1. Raise it if JARVIS wakes by
# mistake; lower it if it misses you.
wake_threshold = 0.5

[paths]
# Where JARVIS keeps its data (action log, stop flag, later: memory).
home = "~/.jarvis"
# The sandbox folder. JARVIS may create files here without asking.
workspace = "~/.jarvis/workspace"

[permissions]
# How much JARVIS may do without asking:
#   "careful"       asks before overwriting, deleting, running any command,
#                   or touching anything outside the workspace
#   "trusted"       asks only before deleting or sending. After it has read
#                   a web page or a file from outside the workspace, it also
#                   asks before changing, running or controlling anything
#                   for the rest of that request (see below).
#   "unrestricted"  never asks
# In every mode: blocked commands stay blocked, sensitive files are
# protected, and the Stop button works.
mode = "trusted"
# Tier for tools that do not say what kind of action they are.
default = "confirm"
# Web pages and files can contain hidden instructions aimed at JARVIS. With
# this on, once such content has been read, later actions in the same
# request need your "yes". Turning it off means a malicious page could make
# JARVIS act without you seeing it first.
confirm_after_untrusted = true

# Optional per-tool overrides: "auto" | "confirm" | "blocked". Examples:
#   run_command = "confirm"   always ask before running a command
#   delete_file = "auto"      delete without asking
[permissions.tools]

[permissions.sensitive]
# Reading anything matching these patterns needs confirmation.
paths = [
    "**/.ssh/**", "**/.aws/**", "**/.gnupg/**", "**/.azure/**", "**/.kube/**",
    "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.pfx", "**/*.kdbx",
    "**/id_rsa*", "**/id_ed25519*", "**/.netrc", "**/.git-credentials",
    "**/AppData/Local/Google/Chrome/User Data/**",
    "**/AppData/Local/Microsoft/Edge/User Data/**",
    "**/AppData/Roaming/Mozilla/Firefox/Profiles/**",
    "**/AppData/Roaming/Microsoft/Credentials/**",
    "**/AppData/Roaming/Microsoft/Protect/**",
]

[permissions.blocked]
# Commands or code matching any of these (case-insensitive regex) are refused
# outright: system security settings, credential stores, disk destruction.
# This list is a backstop, not a guarantee; the real protection is that every
# command needs your "yes".
patterns = [
    'netsh\s+advfirewall', 'Set-NetFirewall', 'Disable-NetFirewallRule',
    'Set-MpPreference', 'Add-MpPreference', 'Uninstall-WindowsFeature.*Defender',
    'Set-ExecutionPolicy', 'bcdedit', 'manage-bde', 'Disable-BitLocker',
    'EnableLUA', 'ConsentPromptBehaviorAdmin',
    'net\s+(user|localgroup)\s', 'New-LocalUser', 'Add-LocalGroupMember',
    'reg(\.exe)?\s+(add|delete)\s+.*\\(Policies|Lsa|SecurityProviders)',
    'cmdkey', 'vaultcmd', 'mimikatz',
    'format\s+[a-z]:', 'diskpart', 'cipher\s+/w', 'Clear-Disk', 'Format-Volume',
    'ufw\s+disable', 'setenforce\s+0', 'iptables\s+-F', 'csrutil\s+disable',
    'spctl\s+--master-disable', 'mkfs\.', 'dd\s+.*of=/dev/',
    'rm\s+-[a-z]*r[a-z]*f?[a-z]*\s+(/|~|\$HOME)(\s|$)',
]
