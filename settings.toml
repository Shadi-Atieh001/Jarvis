# JARVIS settings. Edit freely; restart JARVIS to apply.
# The API key is NOT stored here. It is read from the ANTHROPIC_API_KEY
# environment variable only.

[assistant]
address_as = "Sir"
# Which brain to use:
#   "ollama"     a free model running on this computer (see [ollama] below)
#   "openai_compatible"  a hosted service that uses the OpenAI chat format
#                (see [openai_compatible] below)
#   "anthropic"  Claude through the Anthropic API: far more capable, paid,
#                needs the ANTHROPIC_API_KEY environment variable
provider = "openai_compatible"
# The settings from here to max_steps apply to "anthropic" only.
model = "claude-fable-5-2"
# How hard the model thinks: low | medium | high | xhigh | max.
# Higher is slower and costs more. "medium" suits everyday requests.
effort = "medium"
# If the model's safety filters decline a request, let Anthropic retry it on
# another model automatically. Set to false to simply report the refusal.
refusal_fallback = true
# Safety cap on tool calls per request, so a confused loop cannot run forever.
max_steps = 40
location = "Sharjah"

[ollama]
# Any Ollama model that supports tool calling: https://ollama.com/search?c=tool
# Download it first with:  ollama pull qwen3:8b
# Bigger models are more reliable but need more graphics memory (VRAM):
# roughly 6 GB for an 8b model, 10 GB for 14b, 20 GB for 30b+.
model = "qwen3:8b"
host = "http://127.0.0.1:11434"
# How much conversation the model can hold, in tokens. Larger holds longer
# conversations but uses more graphics memory; if the model no longer fits
# on the graphics card it spills onto the processor and becomes very slow.
context_window = 8192
# Let the model reason silently before answering. Better on hard tasks, but
# can add tens of seconds to every reply.
think = false
# How long the model stays loaded after the last message.
keep_alive = "30m"

[openai_compatible]
# For hosted model services that speak the OpenAI "chat completions" format.
# base_url is the address from the service's API documentation, ending in /v1
# (JARVIS adds /chat/completions). model is the model's name on that service.
# The model must support tool (function) calling.
base_url = "https://api.ifm.ai/v1"
model = "IFM/K2-Horizon-375B-A23B"
# The NAME of the environment variable holding your key, never the key
# itself. Store the key with:  setx JARVIS_API_KEY "your-key-here"
api_key_env = "JARVIS_API_KEY"

[voice]
# Speech runs entirely on this computer. Set up once with:
#   python -m jarvis voice-setup
enabled = true
# Speech recognition model. "base.en" is quick; "small.en" is more accurate
# but slower. Runs on the processor, not the graphics card.
whisper_model = "base.en"
# The speaking voice. Others are listed at https://rhasspy.github.io/piper-samples/
piper_voice = "en_GB-alan-medium"
# When JARVIS answers aloud: "when_spoken" (only if you spoke),
# "always", or "never".
speak_replies = "when_spoken"

[paths]
# Where JARVIS keeps its data (action log, stop flag, later: memory).
home = "~/.jarvis"
# The sandbox folder. JARVIS may create files here without asking.
workspace = "~/.jarvis/workspace"

[permissions]
# Tier used for any tool that is not listed below and declares none itself.
default = "confirm"
# After JARVIS reads untrusted content (files outside the workspace, and later
# web pages and email), every action that changes anything needs your "yes"
# for the rest of that request, even if it is normally automatic.
confirm_after_untrusted = true

# Per-tool tiers: "auto" | "confirm" | "blocked".
# A tool can still escalate above its tier for a risky call (for example,
# write_file is "auto" but asks before overwriting or writing outside the
# workspace). You can make any tool stricter here. Making run_command or
# run_python "auto" means JARVIS can execute arbitrary code without asking.
[permissions.tools]
read_file = "auto"
list_dir = "auto"
search_files = "auto"
write_file = "auto"
make_dir = "auto"
move_file = "auto"
delete_file = "confirm"
run_command = "confirm"
run_python = "confirm"

[permissions.sensitive]
# Reading anything matching these patterns needs confirmation.
paths = [
    "**/.ssh/**", "**/.aws/**", "**/.gnupg/**", "**/.azure/**", "**/.kube/**",
    "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.pfx", "**/*.kdbx",
    "**/id_rsa*", "**/id_ed25519*", "**/.netrc", "**/.git-credentials",
    "**/AppData/Local/Google/Chrome/User Data/**",
    "**/AppData/Local/Microsoft/Edge/User Data/**",
    "**/AppData/Roaming/Mozilla/Firefox/Profiles/**",
    "**/AppData/Roaming/Microsoft/Credentials/**",
    "**/AppData/Roaming/Microsoft/Protect/**",
]

[permissions.blocked]
# Commands or code matching any of these (case-insensitive regex) are refused
# outright: system security settings, credential stores, disk destruction.
# This list is a backstop, not a guarantee; the real protection is that every
# command needs your "yes".
patterns = [
    'netsh\s+advfirewall', 'Set-NetFirewall', 'Disable-NetFirewallRule',
    'Set-MpPreference', 'Add-MpPreference', 'Uninstall-WindowsFeature.*Defender',
    'Set-ExecutionPolicy', 'bcdedit', 'manage-bde', 'Disable-BitLocker',
    'EnableLUA', 'ConsentPromptBehaviorAdmin',
    'net\s+(user|localgroup)\s', 'New-LocalUser', 'Add-LocalGroupMember',
    'reg(\.exe)?\s+(add|delete)\s+.*\\(Policies|Lsa|SecurityProviders)',
    'cmdkey', 'vaultcmd', 'mimikatz',
    'format\s+[a-z]:', 'diskpart', 'cipher\s+/w', 'Clear-Disk', 'Format-Volume',
    'ufw\s+disable', 'setenforce\s+0', 'iptables\s+-F', 'csrutil\s+disable',
    'spctl\s+--master-disable', 'mkfs\.', 'dd\s+.*of=/dev/',
    'rm\s+-[a-z]*r[a-z]*f?[a-z]*\s+(/|~|\$HOME)(\s|$)',
]
