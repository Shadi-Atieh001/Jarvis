<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #e6e9ee;
    --muted: #8b95a5; --accent: #5cc8ff; --warn: #f0b429; --danger: #ef5350; --ok: #57c98a;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; letter-spacing: .18em; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 13px; flex: 1; }
  #status.busy { color: var(--accent); }
  #status.halted { color: var(--danger); }
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #stop { border-color: var(--danger); color: var(--danger); font-weight: 600; }
  #stop:hover { background: var(--danger); color: #fff; }

  #chat { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user {
    align-self: flex-end; background: #1f2a3a; border-radius: 12px 12px 2px 12px;
    padding: 8px 12px; max-width: 85%;
  }
  .msg.jarvis { align-self: stretch; }
  .msg.info {
    color: var(--muted); font-family: var(--mono); font-size: 13px;
    border-left: 2px solid var(--line); padding-left: 10px;
  }
  .msg pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; margin: 6px 0; overflow-x: auto; font: 13px/1.45 var(--mono); white-space: pre;
  }
  .tool { font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .tool b { font-weight: 600; }
  .tool .auto, .tool .approved { color: var(--ok); }
  .tool .denied, .tool .blocked { color: var(--danger); }

  .confirm {
    border: 1px solid var(--warn); border-radius: 8px; background: var(--panel); padding: 12px 14px;
  }
  .confirm h2 { font-size: 14px; margin: 0 0 2px; color: var(--warn); }
  .confirm .why { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .confirm pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
    margin: 0 0 10px; max-height: 320px; overflow: auto; font: 13px/1.45 var(--mono);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .confirm .row { display: flex; gap: 8px; }
  .confirm .yes { border-color: var(--ok); color: var(--ok); }
  .confirm .yes:hover { background: var(--ok); color: #06210f; }
  .confirm.answered { border-color: var(--line); opacity: .75; }
  .confirm .verdict { font-size: 13px; color: var(--muted); }

  form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  form .inner { flex-direction: row; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; max-height: 180px;
  }
  #send { border-color: var(--accent); color: var(--accent); }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <span id="status" role="status">Connecting…</span>
  <button id="stop" title="Emergency stop: halt everything now">Stop</button>
</header>

<main id="chat"><div class="inner" id="log" aria-live="polite"></div></main>

<form id="form">
  <div class="inner">
    <textarea id="input" rows="1" placeholder="Ask JARVIS, or type /help" aria-label="Message" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
const TOKEN = "__JARVIS_TOKEN__";
const log = document.getElementById("log");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let ws, busy = false, current = null, currentText = "";

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
function setBusy(b) {
  busy = b; sendBtn.disabled = b;
  if (b) setStatus("Working…", "busy"); else setStatus("At your service, __ADDRESS__.");
}
function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function add(el) { log.appendChild(el); scrollDown(); return el; }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Renders reply text. Only ``` code fences are treated specially; everything
// is inserted as text, never as HTML, so replies cannot inject markup.
function render(target, text) {
  target.replaceChildren();
  text.split(/```/).forEach((part, i) => {
    if (i % 2 === 1) {
      target.appendChild(el("pre", "", part.replace(/^[\w+-]*\n/, "")));
    } else if (part) {
      target.appendChild(document.createTextNode(part));
    }
  });
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => setBusy(false);
  ws.onclose = () => { setStatus("Disconnected. Restart JARVIS.", "halted"); sendBtn.disabled = true; };
  ws.onmessage = (event) => handle(JSON.parse(event.data));
}

function handle(m) {
  if (m.type === "text") {
    if (!current) { current = add(el("div", "msg jarvis")); currentText = ""; }
    currentText += m.delta;
    render(current, currentText);
    scrollDown();
  } else if (m.type === "tool") {
    current = null;
    const row = el("div", "tool");
    row.appendChild(el("b", m.decision, m.decision));
    row.appendChild(document.createTextNode(`  ${m.name}: ${m.summary}`));
    add(row);
  } else if (m.type === "confirm") {
    current = null;
    showConfirm(m);
  } else if (m.type === "info") {
    current = null;
    add(el("div", "msg info", m.text));
    if (/stop engaged/i.test(m.text)) setStatus("Emergency stop engaged.", "halted");
    if (/stop cleared/i.test(m.text) && !busy) setBusy(false);
  } else if (m.type === "done") {
    current = null;
    setBusy(false);
    if (m.status === "stopped") setStatus("Emergency stop engaged.", "halted");
  }
}

function showConfirm(m) {
  const card = el("div", "confirm");
  card.setAttribute("role", "alertdialog");
  card.appendChild(el("h2", "", `Permission needed: ${m.tool}`));
  card.appendChild(el("div", "why", `Why you are being asked: ${m.reason}`));
  card.appendChild(el("pre", "", m.description));
  const row = el("div", "row");
  const yes = el("button", "yes", "Yes, proceed");
  const no = el("button", "", "No");
  const answer = (approved) => {
    ws.send(JSON.stringify({ type: "confirm_reply", id: m.id, approved }));
    card.classList.add("answered");
    row.replaceWith(el("div", "verdict", approved ? "You approved this." : "You refused this."));
    input.focus();
  };
  yes.onclick = () => answer(true);
  no.onclick = () => answer(false);
  row.append(yes, no);
  card.appendChild(row);
  add(card);
  no.focus();  // the safe choice is the default
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws.readyState !== 1) return;
  const isCommand = text.startsWith("/");
  if (busy && !isCommand) return;
  add(el("div", "msg user", text));
  ws.send(JSON.stringify({ type: "user", text }));
  input.value = ""; input.style.height = "auto";
  if (!isCommand) { current = null; setBusy(true); }
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
});
document.getElementById("stop").onclick = () => {
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: "stop" }));
};

connect();
</script>
</body>
</html>
