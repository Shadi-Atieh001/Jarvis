[project]
name = "jarvis"
version = "0.12.0"
description = "A personal AI assistant for Windows that runs on your own computer, behind a permission system."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7",
    "jsonschema>=4.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ddgs>=9.0",
    "keyring>=24.0",
    "pypdf>=5.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10.0", "pywinauto>=0.6.9; sys_platform == 'win32'"]
memory = ["fastembed>=0.5"]
voice = ["faster-whisper>=1.1", "piper-tts>=1.3", "openwakeword>=0.4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["ui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_embeddings: uses the real embedding model instead of word matching"]
